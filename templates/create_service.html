<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Create Service</title>
</head>
<body>
    <div class="container mt-5">
        <h2>Create New Service</h2>
        <form method="POST" action="{{ url_for('create_service') }}">
            <div class="mb-3">
                <label for="service_name" class="form-label">Service Name</label>
                <input type="text" name="service_name" id="service_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="base_price" class="form-label">Base Price</label>
                <input type="number" step="0.01" name="base_price" id="base_price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="time_required" class="form-label">Time Required</label>
                <input type="text" name="time_required" id="time_required" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea name="description" id="description" class="form-control" rows="3" required></textarea>
            </div>
            
            <button type="submit" class="btn btn-success">Create Service</button>
        </form>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
    </div>
</body>
</html>
