<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Service</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Edit Service</h2>
        <form action="{{ url_for('edit_service', service_id=service.id) }}" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Service Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ service.name }}" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Base Price</label>
                <input type="number" class="form-control" id="price" name="base_price" value="{{ service.base_price }}" required>
            </div>
            <div class="mb-3">
                <label for="time_required" class="form-label">Time Required</label>
                <input type="text" class="form-control" id="time_required" name="time_required" value="{{ service.time_required }}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" required>{{ service.description }}</textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Update Service</button>
        </form>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-3">Cancel</a>
    </div>
</body>
</html>
