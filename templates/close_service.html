<!DOCTYPE html>
<html lang="en">
<head>
    <title>Close Service</title>
</head>
<body>
    <h2>Close Service: {{ service_request.service.name }}</h2>
    <form method="POST" action="{{ url_for('close_service', request_id=service_request.id) }}">
        <div class="form-group">
            <label for="rating">Rating (1-5):</label>
            <select name="rating" id="rating" class="form-control" required>
                <option value="1">1 - Very Poor</option>
                <option value="2">2 - Poor</option>
                <option value="3">3 - Average</option>
                <option value="4">4 - Good</option>
                <option value="5">5 - Excellent</option>
            </select>
        </div>
        <div class="form-group">
            <label for="remarks">Remarks:</label>
            <textarea name="remarks" id="remarks" class="form-control" placeholder="Leave your feedback..." rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Feedback</button>
    </form>
</body>
</html>
